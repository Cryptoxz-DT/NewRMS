# Production Environment Configuration
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Production database (use environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Connection pool optimization for production
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# Security
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# Actuator - only expose health and metrics
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized

# Logging
logging.level.root=WARN
logging.level.com.DevanshNewRMS.NewRMS=INFO
logging.level.org.springframework.security=WARN
