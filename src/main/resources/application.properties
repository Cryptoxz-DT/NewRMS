spring.application.name=NewRMS

# ========== SERVER CONFIG ==========
server.port=8085

# ========== DATABASE CONFIG ==========
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver
# Connection pool settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ========== JPA CONFIG ==========
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ========== LOGGING ==========
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ========== SECURITY ==========
# JWT secret should be at least 256 bits (32 characters) for HS256
app.security.jwt.secret=${JWT_SECRET:ThisIsAVeryLongSecretKeyForJWTTokenGeneration2024}
app.security.jwt.expiration=${JWT_EXPIRATION:86400000}

# ========== CORS CONFIG ==========
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
