# Development Environment Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Development database (can use H2 for local development)
spring.datasource.url=jdbc:postgresql://localhost:5432/restaurant_db_dev
spring.datasource.username=postgres
spring.datasource.password=changeme

# Enable all actuator endpoints for development
management.endpoints.web.exposure.include=*

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# Logging
logging.level.com.DevanshNewRMS.NewRMS=DEBUG
logging.level.org.springframework.security=DEBUG
